name: Deploy to Vercel (manual)

# The repo is now Git-connected in Vercel, so every push to main deploys
# automatically there. This workflow is kept only as a manual fallback
# (Actions tab) and for `repository_dispatch` (type: sanity-publish).
# Prefer a Vercel deploy hook for Sanity webhooks.
#
# Required repo secret: VERCEL_TOKEN_NEW.

on:
  repository_dispatch:
    types: [ sanity-publish ]
  workflow_dispatch: {}
  # Called by scheduled-posts.yml on days a scheduled article goes live.
  workflow_call: {}

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_NEW }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Link Vercel project
        run: vercel link --yes --project arasya-web --scope sutanariefs-projects-a26c91df --token="$VERCEL_TOKEN"
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
