name: Deploy to Vercel

# Builds with the Vercel CLI and deploys to production on every push to main.
# Also runs on `repository_dispatch` (type: sanity-publish) so a Sanity webhook
# can trigger a rebuild when content is published.
#
# Required repo secret: VERCEL_TOKEN_NEW. Once the Vercel GitHub App is
# installed on the org and the project is Git-connected, delete this workflow
# and use a Vercel deploy hook instead, or every push deploys twice.

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ sanity-publish ]
  workflow_dispatch: {}

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_NEW }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Link Vercel project
        run: vercel link --yes --project arasya-web --scope sutanariefs-projects-a26c91df --token="$VERCEL_TOKEN"
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
